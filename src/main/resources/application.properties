# ============================================================================
# P2P Messenger Configuration
# ============================================================================
# Application Info
app.name=P2P Messenger
app.version=1.0.0
# ============================================================================
# Node Configuration
# ============================================================================
# Node ID (?????????? ????????????? ????)
# ????? ?????????????? ????? ???????? ????????? ??????
node.id=1
# ============================================================================
# Network Configuration
# ============================================================================
# TCP Transport
transport.tcp.port=9877
transport.tcp.buffer.size=65536
transport.tcp.connect.timeout.ms=5000
# UDP Discovery
discovery.udp.port=9876
discovery.udp.broadcast.interval.ms=3000
discovery.udp.node.timeout.ms=10000
# Ring Topology
ring.ttl.default=255
# ============================================================================
# Cryptography Configuration
# ============================================================================
# Key Storage
crypto.keys.directory=${user.home}/.messenger/keys
crypto.keys.encryption.algorithm=RSA
crypto.keys.encryption.keysize=2048
crypto.keys.signing.algorithm=RSA
crypto.keys.signing.keysize=2048
# Hybrid Encryption
crypto.session.key.algorithm=AES
crypto.session.key.keysize=256
crypto.cipher.transformation=AES/GCM/NoPadding
# Signature
crypto.signature.algorithm=SHA256withRSA
# ============================================================================
# Storage Configuration (H2 Database)
# ============================================================================
# Database Location
storage.db.directory=${user.home}/.messenger/outbox
storage.db.url=jdbc:h2:${storage.db.directory}/outbox;AUTO_SERVER=TRUE
storage.db.driver=org.h2.Driver
# Connection Pool
storage.db.pool.size=10
storage.db.pool.timeout.ms=30000
# Schema
storage.db.schema.auto.create=true
# ============================================================================
# Retry & Delivery Configuration
# ============================================================================
# Retry Logic
delivery.retry.max.attempts=5
delivery.retry.base.delay.ms=5000
delivery.retry.check.interval.ms=5000
# Cleanup
delivery.cleanup.interval.ms=3600000
delivery.cleanup.threshold.ms=86400000
# ============================================================================
# File Transfer Configuration
# ============================================================================
# File Storage
file.downloads.directory=${user.home}/.messenger/downloads
file.max.size.bytes=104857600
# ============================================================================
# Logging Configuration
# ============================================================================
# Log Level
logging.level.root=INFO
logging.level.messenger=DEBUG
logging.level.messenger.transport=DEBUG
logging.level.messenger.crypto=DEBUG
logging.level.messenger.storage=INFO
# Log File
logging.file.path=${user.home}/.messenger/logs
logging.file.name=messenger.log
logging.file.max.size=10MB
logging.file.max.history=7
# Console Output
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n
# ============================================================================
# Performance Tuning
# ============================================================================
# Thread Pools
executor.ring.transport.threads=2
executor.delivery.tracker.threads=2
executor.discovery.threads=1
# Buffer Sizes
buffer.read.size=65536
buffer.write.queue.max=100
# ============================================================================
# Development & Debug
# ============================================================================
# Debug Mode
debug.enabled=false
debug.print.messages=false
debug.print.crypto=false
# Test Mode
test.mode=false
test.skip.encryption=false